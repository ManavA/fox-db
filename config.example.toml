# Copy to ~/.foxdb/config.toml (or $FOXDB_HOME/config.toml). All keys are optional.

# Use an external codanna binary (~/.foxdb/bin/codanna) instead of the built-in tree-sitter index.
codanna = false

# The vector arm for questions in words (builds with --features vectors; run `fox vectors setup`
# first, which downloads the model only after naming it). Off unless true.
vectors = false

# Swift/Xcode module (target) name -> platform tag appended to symbol hits as " [tag]".
[module_tags]
MyAppTV = "tvOS"
MyAppMobile = "iOS"

# Agents that get no SubagentStart brief (globs on agent name or type). Setting this replaces
# the default, which keeps zero-context ("goldfish") reviewers zero-context.
[hooks]
skip_agents = ["egm-*", "*goldfish*", "*reviewer*"]
# Opt-in search hooks (AGENTS-SETUP.md step 6). grep_context: after a Bash grep/rg/git grep,
# name each hit's enclosing definition and handle (`fox hook post-tool-use`). prompt_context:
# when a prompt names an identifier or path that resolves to exactly one indexed definition or
# file, add its location (`fox hook user-prompt-submit`). Both off by default.
grep_context = false
prompt_context = false

# Full-text engine per project. "fts5" (default) never uses tantivy. "auto" (opt-in) gives a
# project of at least tantivy_min_docs rows a tantivy index kept by foxd (builds with the tantivy
# feature); smaller projects keep SQLite FTS5 only. "tantivy" gives every project one.
# [search.projects] overrides it by project name. tantivy is faster on very big projects but its
# recall trails FTS5 on some query sets (docs/benchmarks.md).
[search]
backend = "fts5"
tantivy_min_docs = 1000000

[search.projects]
# linux = "tantivy"
